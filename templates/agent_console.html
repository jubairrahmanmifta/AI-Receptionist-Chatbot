<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="csrf-token" content="{{ csrf_token }}"/>
  <title>Agent Console — Smile Dental Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --brand:#1a56db; --ink:#1a1f36; --muted:#6b7280; --line:#e5e7eb; --bg:#f0f4ff; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink);
           height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    /* TOP BAR */
    .topbar { background:var(--ink); color:#fff; padding:0 20px; height:58px; flex-shrink:0;
              display:flex; align-items:center; gap:12px; }
    .topbar h1 { font-size:15px; font-weight:700; white-space:nowrap; }
    .topbar .sub { font-size:12px; color:#9ca3af; }
    .topbar .who { margin-left:auto; font-size:13px; color:#d1d5db; white-space:nowrap; }
    .topbar .who b { color:#fff; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px;
            font-size:12.5px; font-weight:600; border:1px solid transparent; cursor:pointer;
            background:transparent; color:#d1d5db; font-family:inherit; white-space:nowrap; }
    .pill:hover { color:#fff; }
    .pill.online { background:#052e16; color:#4ade80; border-color:#16a34a; }
    .pill.offline { background:#3a1d1d; color:#fca5a5; border-color:#dc2626; }
    .pill.muted { border-color:#374151; }
    .pill .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
    .wait-badge { background:var(--brand); color:#fff; border-radius:20px; padding:3px 11px;
                  font-size:12px; font-weight:700; white-space:nowrap; }
    .wait-badge[hidden] { display:none; }
    .topbar .logout { padding:7px 16px; color:#9ca3af; border:1px solid #374151; border-radius:7px;
                      font-size:13px; text-decoration:none; transition:all .2s; white-space:nowrap; }
    .topbar .logout:hover { border-color:#dc2626; color:#dc2626; }

    /* BANNERS */
    .offline-banner { flex-shrink:0; background:#3b2f0b; color:#fcd34d; padding:8px 20px; font-size:13px; }
    .conn-lost { flex-shrink:0; background:#3a1d1d; color:#fca5a5; padding:8px 20px; font-size:13px;
                 display:flex; align-items:center; gap:8px; }
    .offline-banner[hidden], .conn-lost[hidden] { display:none; }

    /* LAYOUT */
    .app { flex:1; display:grid; grid-template-columns:340px 1fr; overflow:hidden; }
    .sidebar { border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; background:#fff; }
    .tabs { display:flex; border-bottom:1px solid var(--line); flex-shrink:0; }
    .tab { flex:1; padding:13px 8px; font-size:13px; font-weight:600; color:var(--muted);
           background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
           font-family:inherit; display:flex; align-items:center; justify-content:center; gap:6px; }
    .tab:hover { color:var(--brand); }
    .tab.active { color:var(--brand); border-bottom-color:var(--brand); }
    .tab .count { background:#eef2ff; color:var(--brand); border-radius:10px; padding:1px 7px; font-size:11px; font-weight:700; }
    .list { flex:1; overflow-y:auto; }
    .empty-list { padding:40px 20px; text-align:center; color:#9ca3af; font-size:13px; }

    .item { width:100%; text-align:left; border:none; border-bottom:1px solid #f3f4f6; background:#fff;
            padding:12px 14px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:5px;
            transition:background .12s; }
    .item:hover { background:#fafbff; }
    .item.active { background:#eef2ff; box-shadow:inset 3px 0 0 var(--brand); }
    .item.flash { animation:flash 1.1s ease-in-out 4; }
    @keyframes flash { 0%,100%{background:#fff} 50%{background:#fef9c3} }
    .item .row { display:flex; align-items:center; gap:6px; }
    .item .preview { font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
                     white-space:nowrap; font-family:'Hind Siliguri','Inter',sans-serif; }
    .item .name { font-size:13.5px; font-weight:700; }
    .item .phone { font-size:12.5px; color:var(--brand); font-weight:600; margin-left:auto; }
    .chip { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; letter-spacing:.3px;
            background:#f3f4f6; color:#4b5563; white-space:nowrap; }
    .chip.lang { background:#eff6ff; color:var(--brand); }
    .chip.pos { background:var(--brand); color:#fff; }
    .chip.away { background:#fef2f2; color:#b91c1c; }
    .chip.st-new { background:#fef9c3; color:#854d0e; }
    .chip.st-contacted { background:#e0e7ff; color:#3730a3; }
    .chip.st-done { background:#dcfce7; color:#166534; }
    .dot-unread { width:9px; height:9px; border-radius:50%; background:#dc2626; flex-shrink:0; }
    .cb-actions { display:flex; gap:6px; margin-top:3px; }
    .mini { padding:4px 10px; font-size:11.5px; font-weight:600; border-radius:6px; cursor:pointer;
            border:1px solid var(--line); background:#fff; color:var(--muted); font-family:inherit; }
    .mini:hover { border-color:var(--brand); color:var(--brand); }
    .mini.on { background:var(--brand); border-color:var(--brand); color:#fff; }

    /* PANEL */
    .panel { display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
    .panel-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
                   color:#9ca3af; gap:10px; }
    .panel-empty .ic { font-size:42px; }
    .back-btn { display:none; }
    .conv { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .conv[hidden] { display:none; }
    .conv-head { background:#fff; border-bottom:1px solid var(--line); padding:12px 18px; flex-shrink:0; }
    .conv-head .line1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .conv-head .title { font-size:15px; font-weight:700; }
    .conv-head .meta { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:12px; flex-wrap:wrap; }
    .conv-body { flex:1; display:grid; grid-template-columns:1fr 260px; overflow:hidden; }
    .transcript { overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .transcript::-webkit-scrollbar { width:6px; }
    .transcript::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
    .m { display:flex; flex-direction:column; max-width:74%; gap:3px; font-family:'Hind Siliguri','Inter',sans-serif; }
    .m.customer { align-self:flex-start; }
    .m.bot { align-self:flex-start; }
    .m.agent { align-self:flex-end; align-items:flex-end; }
    .m.system { align-self:center; max-width:90%; }
    .m .label { font-size:11px; color:#9ca3af; font-weight:600; display:flex; align-items:center; gap:5px; }
    .m .bubble { padding:9px 13px; border-radius:13px; font-size:13.5px; line-height:1.55; overflow-wrap:anywhere; }
    .m.customer .bubble { background:#fff; border:1px solid var(--line); border-top-left-radius:4px; }
    .m.bot .bubble { background:#f1f3f9; border:1px solid #e3e7f2; color:#4b5563; border-top-left-radius:4px; }
    .m.agent .bubble { background:var(--brand); color:#fff; border-top-right-radius:4px; }
    .m.agent.other .bubble { background:#0f766e; }
    .m.system .bubble { background:transparent; color:#8b93a7; font-size:11.5px; text-align:center; padding:2px 8px; }
    .m .time { font-size:10.5px; color:#b6bcc9; }

    .side-card { border-left:1px solid var(--line); background:#fff; overflow-y:auto; padding:14px; }
    .side-card h3 { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
                    margin-bottom:8px; }
    .side-card .sc-block { margin-bottom:18px; }
    .side-card .sc-item { border:1px solid var(--line); border-radius:9px; padding:9px 10px; margin-bottom:8px; font-size:12.5px; }
    .side-card .sc-item .t { font-weight:700; }
    .side-card .sc-item .d { color:var(--muted); margin-top:2px; font-family:'Hind Siliguri','Inter',sans-serif; }
    .side-card .sc-none { font-size:12px; color:#9ca3af; }

    /* ACTIONS + COMPOSER */
    .conv-actions { flex-shrink:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px;
                    display:flex; gap:10px; flex-wrap:wrap; }
    .btn { padding:9px 18px; border:none; border-radius:8px; font-size:13px; font-weight:600;
           cursor:pointer; font-family:inherit; }
    .btn.accept { background:#16a34a; color:#fff; }
    .btn.accept:hover { background:#15803d; }
    .btn.handback { background:#fff; color:#3730a3; border:1px solid #c7d2fe; }
    .btn.handback:hover { border-color:#3730a3; }
    .btn.close { background:#fff; color:#b91c1c; border:1px solid #fecaca; }
    .btn.close:hover { border-color:#dc2626; }
    .composer { flex-shrink:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px;
                display:flex; gap:8px; align-items:flex-end; }
    #composer-input { flex:1; background:#f9fafb; border:1px solid var(--line); border-radius:9px;
                      padding:10px 13px; font-size:13.5px; font-family:'Hind Siliguri','Inter',sans-serif;
                      outline:none; resize:none; color:var(--ink); }
    #composer-input:focus { border-color:var(--brand); background:#fff; }
    #composer-input:disabled { background:#f3f4f6; color:#9ca3af; cursor:not-allowed; }
    #canned { max-width:170px; background:#f9fafb; border:1px solid var(--line); border-radius:9px;
              padding:10px 8px; font-size:12.5px; font-family:inherit; color:var(--muted); outline:none; }
    .btn.send { background:var(--brand); color:#fff; padding:10px 20px; }
    .btn.send:disabled { background:#c7d2fe; cursor:not-allowed; }

    /* TOAST */
    .toast { position:fixed; right:20px; bottom:20px; background:var(--ink); color:#fff; padding:12px 18px;
             border-radius:10px; font-size:13px; opacity:0; transform:translateY(12px); pointer-events:none;
             transition:all .25s; z-index:50; max-width:340px; }
    .toast.show { opacity:1; transform:translateY(0); }

    /* RESPONSIVE */
    @media (max-width:860px) {
      .app { grid-template-columns:1fr; }
      .app .panel { display:none; }
      .app.show-chat .sidebar { display:none; }
      .app.show-chat .panel { display:flex; }
      .back-btn { display:inline-flex; align-items:center; gap:6px; background:#fff; border:none;
                  border-bottom:1px solid var(--line); padding:12px 18px; font-size:14px; font-weight:600;
                  color:var(--brand); cursor:pointer; font-family:inherit; flex-shrink:0; }
      .conv-body { grid-template-columns:1fr; }
      .side-card { border-left:none; border-top:1px solid var(--line); }
      .topbar { height:auto; flex-wrap:wrap; padding:10px 14px; gap:8px 10px; }
      .topbar .who { margin-left:0; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <span>🦷</span>
  <h1>Smile Dental Care</h1><span class="sub">/ Agent</span>
  <span class="wait-badge" id="wait-badge" hidden>0 waiting</span>
  <span class="who">Signed in as <b id="who-name"></b></span>
  <button class="pill offline" id="online-btn" onclick="toggleOnline()">
    <span class="dot"></span><span id="online-label">Offline</span>
  </button>
  <button class="pill muted" id="sound-btn" onclick="toggleSound()">🔇 Sound off</button>
  <a class="logout" href="/agent/logout">Logout</a>
</div>

<div class="offline-banner" id="offline-banner" hidden>
  You're offline — new chats will not be routed to you. Switch to Online to start receiving customers.
</div>
<div class="conn-lost" id="conn-lost" hidden>⚠️ Connection lost — retrying…</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="tabs">
      <button class="tab active" data-tab="waiting" onclick="setTab('waiting')">Waiting <span class="count" id="count-waiting">0</span></button>
      <button class="tab" data-tab="mine" onclick="setTab('mine')">My chats <span class="count" id="count-mine">0</span></button>
      <button class="tab" data-tab="callbacks" onclick="setTab('callbacks')">Callbacks <span class="count" id="count-callbacks">0</span></button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="panel">
    <div class="panel-empty" id="panel-empty">
      <div class="ic">💬</div>
      <div>Select a chat to view the conversation</div>
    </div>

    <div class="conv" id="conv" hidden>
      <button class="back-btn" onclick="showList()">← Back to list</button>
      <div class="conv-head">
        <div class="line1">
          <span class="title" id="conv-title"></span>
          <span class="chip lang" id="conv-lang"></span>
          <span class="chip" id="conv-status"></span>
        </div>
        <div class="meta" id="conv-meta"></div>
      </div>
      <div class="conv-body">
        <div class="transcript" id="transcript" aria-live="polite" role="log" aria-label="Conversation"></div>
        <aside class="side-card">
          <div class="sc-block">
            <h3>Linked appointments</h3>
            <div id="sc-appts"></div>
          </div>
          <div class="sc-block">
            <h3>Callback requests</h3>
            <div id="sc-callbacks"></div>
          </div>
        </aside>
      </div>
      <div class="conv-actions" id="conv-actions"></div>
      <div class="composer">
        <select id="canned" aria-label="Insert a canned reply" onchange="insertCanned(this)" disabled>
          <option value="">Canned replies…</option>
        </select>
        <textarea id="composer-input" rows="1" placeholder="Type a reply…" aria-label="Reply" disabled></textarea>
        <button class="btn send" id="send-btn" onclick="sendReply()" disabled>Send</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   Agent console — drives the existing /agent/api JSON endpoints.
   All customer/bot/agent text is written with textContent (never innerHTML).
   ══════════════════════════════════════════════════════════════════════════ */

const MY_ID       = {{ agent_id | tojson }};
const MY_ROLE     = {{ agent_role | tojson }};
const DISPLAY_NAME= {{ display_name | tojson }};
const IS_ONLINE   = {{ is_online | tojson }};
const CSRF        = document.querySelector('meta[name="csrf-token"]').content;
const PERSONA     = { en: {{ persona_name | tojson }}, bn: {{ persona_name_bn | tojson }} };
const BASE_TITLE  = document.title;

const POLL_QUEUE   = 3000;    // queue + callbacks (visible)
const POLL_CONV    = 2000;    // open conversation (visible)
const POLL_HIDDEN  = 10000;   // while the tab is hidden
const POLL_MAX     = 30000;   // backoff ceiling
const HEARTBEAT_MS = 15000;

const state = {
  online: IS_ONLINE,
  sound: false,
  tab: "waiting",
  waiting: [],
  mine: [],
  callbacks: [],
  openId: null,
  conv: null,
  lastMsgId: 0,
  seen: {},            // convId -> last_message_at we've acknowledged
  unread: {},          // convId -> bool
  knownWaiting: null,  // Set of ids, null until first load
  flash: new Set(),
  canned: { en: [], bn: [] },
  queueBackoff: 0,
  convBackoff: 0,
  queueBusy: false,
  convBusy: false,
};

const $ = id => document.getElementById(id);

/* ── DOM helper (textContent only) ────────────────────────────────────────── */
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "dataset") Object.assign(n.dataset, v);
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" || typeof kid === "number"
      ? document.createTextNode(String(kid)) : kid);
  }
  return n;
}

/* ── Networking ───────────────────────────────────────────────────────────── */
function setConnLost(on) { $("conn-lost").hidden = !on; }

async function api(path, opts = {}) {
  const method = opts.method || "GET";
  const headers = {};
  const init = { method, headers };
  if (opts.body !== undefined) {
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  if (method !== "GET") headers["X-CSRF-Token"] = CSRF;

  let res;
  try {
    res = await fetch(path, init);
  } catch (e) {
    setConnLost(true);
    return { ok: false, status: 0, network: true, data: null };
  }
  if (res.status === 401) { window.location.href = "/agent/login"; return { ok: false, status: 401 }; }

  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  setConnLost(false);

  if (res.ok) return { ok: true, status: res.status, data };
  if (res.status === 403) toast("Not allowed (403).");
  else if (res.status === 429) toast("Too many requests — slowing down.");
  else if (res.status >= 500) toast("Server error (" + res.status + ").");
  return { ok: false, status: res.status, data };
}

/* ── Toast ────────────────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

/* ── Sound (Web Audio, no files) ──────────────────────────────────────────── */
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* audio unavailable */ }
}
function beep() {
  if (!state.sound) return;
  try {
    ensureAudio();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.3);
  } catch (e) { /* ignore */ }
}
function toggleSound() {
  state.sound = !state.sound;
  if (state.sound) ensureAudio();
  $("sound-btn").textContent = state.sound ? "🔊 Sound on" : "🔇 Sound off";
  $("sound-btn").classList.toggle("muted", !state.sound);
}

/* ── Online / offline ─────────────────────────────────────────────────────── */
function renderOnline() {
  const btn = $("online-btn");
  btn.classList.toggle("online", state.online);
  btn.classList.toggle("offline", !state.online);
  $("online-label").textContent = state.online ? "Online" : "Offline";
  $("offline-banner").hidden = state.online;
}
async function toggleOnline() {
  state.online = !state.online;
  renderOnline();
  await api("/agent/api/heartbeat", { method: "POST", body: { is_online: state.online } });
  toast(state.online ? "You're online — waiting for chats." : "You're offline.");
}

/* ── Title / counts ───────────────────────────────────────────────────────── */
function updateTitle() {
  const n = state.waiting.length;
  document.title = (n > 0 && state.tab !== "waiting") ? "(" + n + ") " + BASE_TITLE : BASE_TITLE;
}
function renderCounts() {
  $("count-waiting").textContent = state.waiting.length;
  $("count-mine").textContent = state.mine.length;
  $("count-callbacks").textContent = state.callbacks.length;
  const badge = $("wait-badge");
  badge.hidden = state.waiting.length === 0;
  badge.textContent = state.waiting.length + " waiting";
}

/* ── Formatting ───────────────────────────────────────────────────────────── */
function fmtWait(sec) {
  sec = Math.max(0, sec | 0);
  if (sec < 60) return sec + "s";
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + "m" + (s ? " " + s + "s" : "");
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function langLabel(lang) { return (lang === "bn") ? "বাংলা" : "English"; }
function reasonLabel(r) {
  return ({ customer_button: "asked for a person", "bot_escalation": "bot escalation",
            customer: "asked for a person" })[r] || (r || "queued");
}
function statusLabel(s) {
  return ({ bot: "Bot", waiting: "Waiting", with_agent: "With agent", closed: "Closed" })[s] || s;
}
function cbStatusLabel(s) { return ({ new: "New", contacted: "Contacted", done: "Done" })[s] || s; }

/* ── Sidebar list ─────────────────────────────────────────────────────────── */
function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  updateTitle();
  renderList();
}
function renderList() {
  const list = $("list");
  list.textContent = "";
  if (state.tab === "waiting") renderWaiting(list);
  else if (state.tab === "mine") renderMine(list);
  else renderCallbacks(list);
}
function emptyList(list, msg) { list.appendChild(h("div", { class: "empty-list", text: msg })); }

function renderWaiting(list) {
  if (!state.waiting.length) return emptyList(list, "No customers waiting right now.");
  state.waiting.forEach((w, i) => {
    const item = h("button",
      { class: "item" + (w.id === state.openId ? " active" : "") + (state.flash.has(w.id) ? " flash" : ""),
        onclick: () => openConversation(w.id) },
      h("div", { class: "row" },
        h("span", { class: "chip pos", text: String(i + 1) }),
        h("span", { class: "chip lang", text: langLabel(w.lang) }),
        h("span", { class: "chip", text: fmtWait(w.wait_seconds) }),
        w.customer_away ? h("span", { class: "chip away", text: "customer away" }) : null),
      h("div", { class: "preview", text: w.last_message || "(no messages yet)" }),
      h("div", { class: "row", style: "margin-top:2px" },
        h("span", { class: "chip", text: "via " + reasonLabel(w.handoff_reason) })));
    list.appendChild(item);
  });
}

function renderMine(list) {
  if (!state.mine.length) return emptyList(list, "You have no active chats.");
  state.mine.forEach(c => {
    const item = h("button",
      { class: "item" + (c.id === state.openId ? " active" : ""),
        onclick: () => openConversation(c.id) },
      h("div", { class: "row" },
        state.unread[c.id] ? h("span", { class: "dot-unread" }) : null,
        h("span", { class: "chip lang", text: langLabel(c.lang) }),
        h("span", { class: "chip", text: statusLabel(c.status) }),
        h("span", { class: "chip", text: fmtTime(c.last_message_at) })),
      h("div", { class: "preview", text: (c.last_sender === "agent" ? "You: " : "") + (c.last_message || "(no messages)") }));
    list.appendChild(item);
  });
}

function renderCallbacks(list) {
  if (!state.callbacks.length) return emptyList(list, "No callback requests.");
  state.callbacks.forEach(cb => {
    const item = h("div", { class: "item", style: "cursor:default" },
      h("div", { class: "row" },
        h("span", { class: "name", text: cb.name || "—" }),
        h("span", { class: "phone", text: cb.phone || "—" })),
      cb.message ? h("div", { class: "preview", text: cb.message }) : null,
      h("div", { class: "row" },
        h("span", { class: "chip st-" + (cb.status || "new"), text: cbStatusLabel(cb.status) }),
        h("span", { class: "chip", text: fmtTime(cb.created_at) })),
      h("div", { class: "cb-actions" },
        ["new", "contacted", "done"].map(s =>
          h("button", { class: "mini" + (cb.status === s ? " on" : ""), text: cbStatusLabel(s),
                        onclick: () => setCallbackStatus(cb.id, s) }))));
    list.appendChild(item);
  });
}

async function setCallbackStatus(id, status) {
  const r = await api("/agent/api/callbacks/" + id + "/status", { method: "POST", body: { status } });
  if (r.ok && r.data && r.data.callback) {
    const idx = state.callbacks.findIndex(c => c.id === id);
    if (idx >= 0) state.callbacks[idx] = r.data.callback;
    renderList();
    toast("Callback marked " + cbStatusLabel(status).toLowerCase() + ".");
  } else if (r.status === 400) {
    toast("That status isn't allowed.");
  } else if (r.status === 404) {
    toast("That callback request no longer exists.");
  }
}

/* ── Queue polling ────────────────────────────────────────────────────────── */
function queueDelay() {
  return Math.max(document.hidden ? POLL_HIDDEN : POLL_QUEUE, state.queueBackoff);
}

async function queueTick() {
  if (state.queueBusy) return;
  state.queueBusy = true;
  let network = false;
  try {
    const q = await api("/agent/api/queue");
    if (q.ok && q.data) {
      state.waiting = q.data.waiting || [];
      state.mine = q.data.mine || [];
    } else if (q.network) network = true;

    const cb = await api("/agent/api/callbacks");
    if (cb.ok && cb.data) state.callbacks = cb.data.callbacks || [];
    else if (cb.network) network = true;
  } finally {
    state.queueBusy = false;
  }
  state.queueBackoff = network
    ? (state.queueBackoff ? Math.min(state.queueBackoff * 2, POLL_MAX) : POLL_QUEUE)
    : 0;

  updateMyUnread();
  detectNewWaiting();
  renderCounts();
  updateTitle();
  renderList();
  scheduleQueue(queueDelay());
}

function scheduleQueue(delay) {
  clearTimeout(state.queueTimer);
  state.queueTimer = setTimeout(queueTick, delay);
}
function queueTickNow() {
  if (state.queueBusy) return;
  clearTimeout(state.queueTimer);
  queueTick();
}

function detectNewWaiting() {
  const ids = new Set(state.waiting.map(w => w.id));
  if (state.knownWaiting === null) { state.knownWaiting = ids; return; }
  let added = false;
  ids.forEach(id => {
    if (!state.knownWaiting.has(id)) {
      added = true;
      state.flash.add(id);
      setTimeout(() => { state.flash.delete(id); renderList(); }, 6000);
    }
  });
  state.knownWaiting = ids;
  if (added) beep();
}

function updateMyUnread() {
  state.mine.forEach(c => {
    const prev = state.seen[c.id];
    if (prev === undefined) { state.seen[c.id] = c.last_message_at || ""; return; }
    if ((c.last_message_at || "") !== prev) {
      if (c.last_sender === "customer" && c.id !== state.openId) state.unread[c.id] = true;
      state.seen[c.id] = c.last_message_at || "";
    }
    if (c.id === state.openId) state.unread[c.id] = false;
  });
  const ids = new Set(state.mine.map(c => c.id));
  Object.keys(state.unread).forEach(k => { if (!ids.has(Number(k))) delete state.unread[k]; });
}

/* ── Conversation panel ───────────────────────────────────────────────────── */
function showList() { $("app").classList.remove("show-chat"); }

function openConversation(id) {
  state.openId = id;
  state.conv = null;
  state.lastMsgId = 0;
  state.unread[id] = false;
  $("transcript").textContent = "";
  $("conv").hidden = false;
  $("panel-empty").style.display = "none";
  $("app").classList.add("show-chat");
  renderConvHeader();
  renderActions();
  renderComposer();
  renderList();
  convTickNow();
}

function closeConversationPanel() {
  state.openId = null;
  state.conv = null;
  $("conv").hidden = true;
  $("panel-empty").style.display = "flex";
  $("app").classList.remove("show-chat");
  renderList();
}

function convDelay() {
  return Math.max(document.hidden ? POLL_HIDDEN : POLL_CONV, state.convBackoff);
}

async function convTick() {
  if (state.convBusy || !state.openId) { scheduleConv(convDelay()); return; }
  state.convBusy = true;
  const id = state.openId;
  let r;
  try {
    r = await api("/agent/api/conversation/" + id + "?after_id=" + state.lastMsgId);
  } finally {
    state.convBusy = false;
  }
  if (r.ok && r.data) {
    state.convBackoff = 0;
    if (state.openId === id) applyConversation(r.data);
  } else if (r.network) {
    state.convBackoff = state.convBackoff ? Math.min(state.convBackoff * 2, POLL_MAX) : POLL_CONV;
  } else if (r.status === 403 || r.status === 404) {
    closeConversationPanel();
    toast("This chat is no longer available.");
  }
  scheduleConv(convDelay());
}
function scheduleConv(delay) {
  clearTimeout(state.convTimer);
  state.convTimer = setTimeout(convTick, delay);
}
function convTickNow() {
  if (state.convBusy) return;
  clearTimeout(state.convTimer);
  convTick();
}

function applyConversation(data) {
  const conv = data.conversation;
  state.conv = conv;
  (data.messages || []).forEach(appendMessage);
  state.seen[conv.id] = conv.last_message_at || state.seen[conv.id];
  state.unread[conv.id] = false;
  renderConvHeader();
  renderSideCard(data.appointments || [], data.callbacks || []);
  renderActions();
  renderComposer();
  if (conv.lang) rebuildCanned(conv.lang);
}

function appendMessage(m) {
  if (!m || m.content == null) return;
  if (m.id != null && m.id <= state.lastMsgId && state.lastMsgId !== 0
      && $("transcript").querySelector('[data-id="' + m.id + '"]')) return;
  if (m.id != null && m.id > state.lastMsgId) state.lastMsgId = m.id;

  const sender = m.sender_type || "system";
  let node;
  if (sender === "system") {
    node = h("div", { class: "m system" }, h("div", { class: "bubble", text: m.content }));
  } else if (sender === "customer") {
    node = h("div", { class: "m customer" },
      h("div", { class: "label", text: "Customer" }),
      h("div", { class: "bubble", text: m.content }),
      h("div", { class: "time", text: fmtTime(m.created_at) }));
  } else if (sender === "bot") {
    const persona = PERSONA[state.conv && state.conv.lang] || PERSONA.en;
    node = h("div", { class: "m bot" },
      h("div", { class: "label" }, persona + " · bot"),
      h("div", { class: "bubble", text: m.content }),
      h("div", { class: "time", text: fmtTime(m.created_at) }));
  } else {
    const mine = m.agent_id === MY_ID;
    const name = m.agent_display_name || m.agent_username || "Agent";
    node = h("div", { class: "m agent" + (mine ? "" : " other") },
      h("div", { class: "label" }, name + (mine ? " (you)" : "")),
      h("div", { class: "bubble", text: m.content }),
      h("div", { class: "time", text: fmtTime(m.created_at) }));
  }
  if (m.id != null) node.dataset.id = m.id;
  const box = $("transcript");
  box.appendChild(node);
  box.scrollTop = box.scrollHeight;
}

function isMine(conv) { return !!conv && conv.status === "with_agent" && conv.agent_id === MY_ID; }

function renderConvHeader() {
  const c = state.conv;
  if (!c) return;
  $("conv-title").textContent = "Chat #" + c.id;
  $("conv-lang").textContent = langLabel(c.lang);
  $("conv-status").textContent = statusLabel(c.status);
  const meta = $("conv-meta");
  meta.textContent = "";
  if (c.handoff_reason) meta.appendChild(h("span", { text: "Reason: " + reasonLabel(c.handoff_reason) }));
  if (c.status === "waiting") meta.appendChild(h("span", { text: "Waiting " + fmtWait(c.wait_seconds || 0) }));
  if (c.agent_display_name) meta.appendChild(h("span", { text: "Agent: " + c.agent_display_name }));
}

function renderActions() {
  const box = $("conv-actions");
  box.textContent = "";
  const c = state.conv;
  if (!c) { box.hidden = true; return; }
  if (c.status === "waiting") {
    box.hidden = false;
    box.appendChild(h("button", { class: "btn accept", text: "Accept chat", onclick: acceptChat }));
  } else if (isMine(c)) {
    box.hidden = false;
    box.appendChild(h("button", { class: "btn handback", text: "Hand back to bot", onclick: handbackChat }));
    box.appendChild(h("button", { class: "btn close", text: "Close chat", onclick: closeChat }));
  } else {
    box.hidden = true;
  }
}

function renderComposer() {
  const c = state.conv;
  const can = isMine(c);
  $("composer-input").disabled = !can;
  $("send-btn").disabled = !can;
  $("canned").disabled = !can;
  $("composer-input").placeholder = can ? "Type a reply…" : "You can reply once this chat is assigned to you.";
}

function renderSideCard(appts, callbacks) {
  const a = $("sc-appts");
  a.textContent = "";
  if (!appts.length) a.appendChild(h("div", { class: "sc-none", text: "None" }));
  appts.forEach(x => a.appendChild(h("div", { class: "sc-item" },
    h("div", { class: "t", text: (x.patient_name || "Patient") + " · " + (x.status || "PENDING") }),
    h("div", { class: "d", text: "📅 " + (x.date || "—") + "  🕐 " + (x.time || "—") }),
    h("div", { class: "d", text: "📞 " + (x.phone || "—") + (x.notes ? "  · " + x.notes : "") }))));

  const c = $("sc-callbacks");
  c.textContent = "";
  if (!callbacks.length) c.appendChild(h("div", { class: "sc-none", text: "None" }));
  callbacks.forEach(x => c.appendChild(h("div", { class: "sc-item" },
    h("div", { class: "t", text: (x.name || "—") + " · " + cbStatusLabel(x.status) }),
    h("div", { class: "d", text: "📞 " + (x.phone || "—") }),
    x.message ? h("div", { class: "d", text: x.message }) : null)));
}

/* ── Actions ──────────────────────────────────────────────────────────────── */
async function acceptChat() {
  if (!state.openId) return;
  const r = await api("/agent/api/conversation/" + state.openId + "/accept", { method: "POST" });
  if (r.ok) { toast("Chat accepted."); queueTickNow(); convTickNow(); }
  else if (r.status === 409) { toast("Another agent already took this chat."); closeConversationPanel(); queueTickNow(); }
  else if (r.status === 403) { toast("You can't accept this chat."); }
}

async function handbackChat() {
  if (!state.openId || !confirm("Hand this chat back to the bot? The customer will talk to Mita again.")) return;
  const r = await api("/agent/api/conversation/" + state.openId + "/handback", { method: "POST" });
  if (r.ok) { toast("Handed back to the bot."); convTickNow(); queueTickNow(); }
  else if (r.status === 403) toast("You can't change this chat.");
}

async function closeChat() {
  if (!state.openId || !confirm("Close this chat? The customer will see that the chat has ended.")) return;
  const r = await api("/agent/api/conversation/" + state.openId + "/close", { method: "POST" });
  if (r.ok) { toast("Chat closed."); convTickNow(); queueTickNow(); }
  else if (r.status === 403) toast("You can't change this chat.");
}

async function sendReply() {
  const input = $("composer-input");
  const text = input.value.trim();
  if (!text || !state.openId) return;
  $("send-btn").disabled = true;
  const r = await api("/agent/api/conversation/" + state.openId + "/message", { method: "POST", body: { message: text } });
  $("send-btn").disabled = !isMine(state.conv);
  if (r.ok) {
    input.value = "";
    input.style.height = "auto";
    convTickNow();
    input.focus();
  } else if (r.status === 403) toast("This chat isn't yours to reply to.");
  else if (r.status === 409) toast("This chat isn't assigned to you.");
  else if (r.status === 429) toast("Slow down a moment, then try again.");
  else if (r.status === 400) toast("The message was empty or too long.");
}

/* ── Canned replies ───────────────────────────────────────────────────────── */
async function loadCanned() {
  const r = await api("/agent/api/canned");
  if (r.ok && r.data) { state.canned = r.data; rebuildCanned((state.conv && state.conv.lang) || "en"); }
}
function rebuildCanned(lang) {
  const sel = $("canned");
  sel.textContent = "";
  sel.appendChild(h("option", { value: "", text: "Canned replies…" }));
  const list = state.canned[lang] || state.canned.en || [];
  list.forEach(txt => sel.appendChild(h("option", { value: txt, text: txt })));
  sel.value = "";
}
function insertCanned(sel) {
  const val = sel.value;
  sel.value = "";
  if (!val) return;
  const input = $("composer-input");
  input.value = val;
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
  if (!input.disabled) input.focus();
}

/* ── Heartbeat + boot ─────────────────────────────────────────────────────── */
async function heartbeat() {
  await api("/agent/api/heartbeat", { method: "POST", body: { is_online: state.online } });
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { queueTickNow(); convTickNow(); }
});

function init() {
  $("who-name").textContent = DISPLAY_NAME || "Agent";
  renderOnline();
  renderCounts();
  renderList();
  loadCanned();
  queueTick();
  heartbeat();
  setInterval(heartbeat, HEARTBEAT_MS);

  $("composer-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(); }
  });
  $("composer-input").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });
}

init();
</script>
