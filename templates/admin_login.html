<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Smile Dental Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 20px; padding: 44px 38px; width: 100%; max-width: 380px; box-shadow: 0 8px 40px rgba(0,0,0,.1); }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .ic { font-size: 44px; margin-bottom: 8px; }
    .logo h1  { font-size: 19px; font-weight: 800; color: #1a1f36; }
    .logo p   { font-size: 13px; color: #6b7280; margin-top: 3px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 9px; font-size: 14px; font-family: inherit; outline: none; transition: border .2s; margin-bottom: 16px; }
    input:focus { border-color: #1a56db; }
    .btn { width: 100%; padding: 13px; background: #1a56db; color: #fff; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s; }
    .btn:hover { background: #1240a8; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 8px; padding: 11px 14px; font-size: 13px; margin-bottom: 18px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="ic">🔐</div>
      <h1>Admin Panel</h1>
      <p>Smile Dental Care</p>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required autocomplete="off"/>
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required/>
      <button class="btn" type="submit">Login →</button>
    </form>
  </div>
</body>
</html>
